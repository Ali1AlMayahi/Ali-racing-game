<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سباق السيارات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #111;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 700px;
            background-color: #222;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #333;
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
        }

        .hud div span {
            font-weight: bold;
            color: #4caf50;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #ffeb3b;
        }

        .overlay p {
            font-size: 14px;
            margin-bottom: 15px;
            color: #ddd;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #555;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .mode-btn.active {
            background-color: #4caf50;
            border-color: #4caf50;
        }

        .name-input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #4caf50;
            border-radius: 8px;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #45a049;
        }

        .leaderboard {
            margin-top: 15px;
            width: 90%;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            max-height: 180px;
            overflow-y: auto;
        }

        .leaderboard h2 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #4caf50;
        }

        .leaderboard table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .leaderboard th, .leaderboard td {
            padding: 4px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mobile-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .touch-btn {
            width: 48%;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="hud">
            <div>المسافة: <span id="score">0</span> م</div>
            <div id="turn-indicator" class="hidden">اللاعب: <span id="current-player-hud">1</span></div>
            <div>السرعة: <span id="speed">1.0</span>x</div>
            <div>الأفضل: <span id="high-score">0</span> م</div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="overlay" class="overlay">
            <h1 id="overlay-title">لعبة السباق</h1>
            <p id="overlay-desc">تجنب السيارات الأخرى واجمع القدرات الخاصة لاستمرار أطول!</p>
            
            <div class="mode-selection" id="mode-selection-container">
                <button id="mode-single-btn" class="mode-btn active">فردي (1P)</button>
                <button id="mode-versus-btn" class="mode-btn">تناوبي (2P)</button>
            </div>

            <input type="text" id="player-name" class="name-input" placeholder="أدخل اسمك هنا" maxlength="15">
            
            <button id="start-btn" class="btn">ابدأ اللعب</button>

            <div class="leaderboard" id="leaderboard-container">
                <h2>لوحة أفضل النتائج</h2>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الاسم</th>
                            <th>المسافة</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mobile-controls">
            <div id="btn-right" class="touch-btn">➔</div>
            <div id="btn-left" class="touch-btn">⬅</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION CONSTANTS ---
        const LANE_COUNT = 3;
        const INITIAL_SPEED = 300; // pixels per second
        const SPEED_INCREMENT = 15; // speed increase per second
        const MAX_SPEED = 900;
        const ROW_GAP = 250; // vertical gap between obstacle rows
        const HITBOX_REDUCTION = 0.8; // reduce collision box size for forgiveness
        const SLOW_MOTION_DURATION = 3.0; // duration in seconds
        const SLOW_MOTION_FACTOR = 0.4; // 40% speed when slowed down
        const LOCAL_STORAGE_KEY = 'racing_game_leaderboard';

        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const speedElement = document.getElementById('speed');
        const highScoreElement = document.getElementById('high-score');
        const turnIndicator = document.getElementById('turn-indicator');
        const currentPlayerHud = document.getElementById('current-player-hud');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const modeSelectionContainer = document.getElementById('mode-selection-container');
        const modeSingleBtn = document.getElementById('mode-single-btn');
        const modeVersusBtn = document.getElementById('mode-versus-btn');
        const playerNameInput = document.getElementById('player-name');
        const startBtn = document.getElementById('start-btn');
        const leaderboardContainer = document.getElementById('leaderboard-container');
        const leaderboardBody = document.getElementById('leaderboard-body');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // --- GAME STATE VARIABLES ---
        let animationFrameId = null;
        let lastTime = 0;
        let distance = 0;
        let currentSpeed = INITIAL_SPEED;
        let highScore = 0;
        let isRunning = false;
        let lastScoreSoundDistance = 0;

        // Game Modes State
        let gameMode = 'single'; // 'single' or 'versus'
        let currentTurn = 1; // 1 or 2
        let player1Score = 0;
        let player2Score = 0;

        // Power-up State
        let hasShield = false;
        let slowMotionTimer = 0;
        let powerUps = [];

        // Leaderboard State
        let leaderboard = [];

        // --- WEB AUDIO API SYSTEM ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCollisionSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;

            const filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(800, audioCtx.currentTime);
            filterNode.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
            noiseNode.stop(audioCtx.currentTime + 0.4);
        }

        function playScoreSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5

            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playPowerUpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playShieldAbsorbSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.25);

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const notes = [300, 260, 220, 150];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);

                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.12);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.15);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.15);
            });
        }

        // --- LEADERBOARD SYSTEM ---
        function loadLeaderboard() {
            try {
                const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                leaderboard = saved ? JSON.parse(saved) : [];
            } catch (e) {
                leaderboard = [];
            }
            if (leaderboard.length > 0) {
                highScore = leaderboard[0].score;
                highScoreElement.textContent = highScore;
            }
            renderLeaderboard();
        }

        function saveLeaderboard() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(leaderboard));
            } catch (e) {}
        }

        function addScoreToLeaderboard(name, score) {
            if (score <= 0) return;
            const entryName = name.trim() || 'لاعب مجهول';
            leaderboard.push({ name: entryName, score: score });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5); // Keep top 5 scores
            saveLeaderboard();
            renderLeaderboard();
            if (leaderboard.length > 0) {
                highScore = leaderboard[0].score;
                highScoreElement.textContent = highScore;
            }
        }

        function renderLeaderboard() {
            leaderboardBody.innerHTML = '';
            if (leaderboard.length === 0) {
                leaderboardBody.innerHTML = '<tr><td colspan="3">لا توجد نتائج مسجلة بعد</td></tr>';
                return;
            }
            leaderboard.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${escapeHtml(entry.name)}</td>
                    <td>${entry.score} م</td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }

        // Player configuration
        const player = {
            lane: 1, // 0: Left, 1: Center, 2: Right
            targetX: 0,
            x: 0,
            y: 0,
            width: 50,
            height: 90,
            color: '#e74c3c'
        };

        // Obstacles array
        let obstacles = [];
        let nextSpawnY = 0;

        // Road visuals
        let laneLineWidth = 6;
        let roadLineOffset = 0;

        // Touch control variables
        let touchStartX = 0;
        let touchStartY = 0;

        // --- CANVAS RESIZING ---
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            player.width = canvas.width * 0.13;
            player.height = player.width * 1.8;
            player.y = canvas.height - player.height - 80;
            updatePlayerTargetX();
            player.x = player.targetX;
        }

        function getLaneCenter(laneIndex) {
            const laneWidth = canvas.width / LANE_COUNT;
            return (laneWidth * laneIndex) + (laneWidth / 2);
        }

        function updatePlayerTargetX() {
            player.targetX = getLaneCenter(player.lane) - (player.width / 2);
        }

        // --- RESET GAME STATE ---
        function resetGame() {
            distance = 0;
            currentSpeed = INITIAL_SPEED;
            player.lane = 1;
            player.color = (gameMode === 'versus' && currentTurn === 2) ? '#3498db' : '#e74c3c';
            updatePlayerTargetX();
            player.x = player.targetX;
            obstacles = [];
            powerUps = [];
            hasShield = false;
            slowMotionTimer = 0;
            nextSpawnY = -ROW_GAP;
            roadLineOffset = 0;
            lastTime = 0;
            lastScoreSoundDistance = 0;
            
            scoreElement.textContent = '0';
            speedElement.textContent = '1.0';

            if (gameMode === 'versus') {
                turnIndicator.classList.remove('hidden');
                currentPlayerHud.textContent = currentTurn;
            } else {
                turnIndicator.classList.add('hidden');
            }
        }

        // --- MODE SELECTION HANDLERS ---
        modeSingleBtn.addEventListener('click', () => {
            gameMode = 'single';
            modeSingleBtn.classList.add('active');
            modeVersusBtn.classList.remove('active');
            playerNameInput.classList.remove('hidden');
            leaderboardContainer.classList.remove('hidden');
            overlayTitle.textContent = 'لعبة السباق';
            overlayDesc.textContent = 'تجنب السيارات الأخرى واجمع القدرات الخاصة لاستمرار أطول!';
        });

        modeVersusBtn.addEventListener('click', () => {
            gameMode = 'versus';
            modeVersusBtn.classList.add('active');
            modeSingleBtn.classList.remove('active');
            playerNameInput.classList.add('hidden');
            leaderboardContainer.classList.add('hidden');
            overlayTitle.textContent = 'وضع التنافس (2 Players)';
            overlayDesc.textContent = 'يلعب اللاعب الأول ثم يليه اللاعب الثاني للحصول على أطول مسافة!';
        });

        // --- INPUT HANDLERS ---
        function moveLeft() {
            if (!isRunning) return;
            if (player.lane > 0) {
                player.lane--;
                updatePlayerTargetX();
            }
        }

        function moveRight() {
            if (!isRunning) return;
            if (player.lane < LANE_COUNT - 1) {
                player.lane++;
                updatePlayerTargetX();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Left') {
                moveLeft();
            } else if (e.key === 'ArrowRight' || e.key === 'Right') {
                moveRight();
            }
        });

        btnLeft.addEventListener('click', moveLeft);
        btnRight.addEventListener('click', moveRight);

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!isRunning) return;
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
                if (deltaX < 0) {
                    moveLeft();
                } else {
                    moveRight();
                }
            }
        }, { passive: true });

        // --- OBSTACLE & POWER-UP GENERATION ---
        function spawnObstacleRow() {
            // Guarantee at least one lane is empty
            const safeLane = Math.floor(Math.random() * LANE_COUNT);
            const colors = ['#3498db', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22'];
            let emptyLanes = [];

            for (let i = 0; i < LANE_COUNT; i++) {
                if (i !== safeLane && Math.random() > 0.4) {
                    const obstacleWidth = player.width;
                    const obstacleHeight = player.height;
                    const x = getLaneCenter(i) - (obstacleWidth / 2);
                    
                    obstacles.push({
                        x: x,
                        y: -obstacleHeight - 20,
                        width: obstacleWidth,
                        height: obstacleHeight,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                } else {
                    emptyLanes.push(i);
                }
            }

            // Spawn power-up in an empty lane occasionally
            if (emptyLanes.length > 0 && Math.random() < 0.3) {
                const targetLane = emptyLanes[Math.floor(Math.random() * emptyLanes.length)];
                const powerUpSize = player.width * 0.7;
                const type = Math.random() < 0.5 ? 'shield' : 'slowmo';
                const x = getLaneCenter(targetLane) - (powerUpSize / 2);

                powerUps.push({
                    x: x,
                    y: -powerUpSize - 40,
                    width: powerUpSize,
                    height: powerUpSize,
                    type: type,
                    rotation: 0
                });
            }
        }

        // --- COLLISION DETECTION ---
        function checkCollision(rect1, rect2) {
            const r1 = {
                x: rect1.x + (rect1.width * (1 - HITBOX_REDUCTION) / 2),
                y: rect1.y + (rect1.height * (1 - HITBOX_REDUCTION) / 2),
                width: rect1.width * HITBOX_REDUCTION,
                height: rect1.height * HITBOX_REDUCTION
            };

            const r2 = {
                x: rect2.x + (rect2.width * (1 - HITBOX_REDUCTION) / 2),
                y: rect2.y + (rect2.height * (1 - HITBOX_REDUCTION) / 2),
                width: rect2.width * HITBOX_REDUCTION,
                height: rect2.height * HITBOX_REDUCTION
            };

            return r1.x < r2.x + r2.width &&
                   r1.x + r1.width > r2.x &&
                   r1.y < r2.y + r2.height &&
                   r1.y + r1.height > r2.y;
        }

        // --- DRAWING FUNCTIONS ---
        function drawRoad() {
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#ecf0f1';
            ctx.lineWidth = laneLineWidth;
            ctx.setLineDash([40, 30]);
            ctx.lineDashOffset = -roadLineOffset;

            const laneWidth = canvas.width / LANE_COUNT;
            for (let i = 1; i < LANE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(laneWidth * i, 0);
                ctx.lineTo(laneWidth * i, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function drawCar(x, y, width, height, color, isPlayer = false) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(0, 0, width, height, 10);
            ctx.fill();

            ctx.fillStyle = '#111';
            ctx.fillRect(width * 0.15, height * 0.25, width * 0.7, height * 0.4);

            ctx.fillStyle = color;
            ctx.fillRect(width * 0.2, height * 0.35, width * 0.6, height * 0.25);

            if (isPlayer) {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(width * 0.1, 2, width * 0.2, 5);
                ctx.fillRect(width * 0.7, 2, width * 0.2, 5);

                ctx.fillStyle = '#c0392b';
                ctx.fillRect(width * 0.1, height - 5, width * 0.25, 4);
                ctx.fillRect(width * 0.65, height - 5, width * 0.25, 4);
            } else {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(width * 0.1, height - 5, width * 0.2, 5);
                ctx.fillRect(width * 0.7, height - 5, width * 0.2, 5);

                ctx.fillStyle = '#c0392b';
                ctx.fillRect(width * 0.1, 2, width * 0.25, 4);
                ctx.fillRect(width * 0.65, 2, width * 0.25, 4);
            }

            ctx.fillStyle = '#000';
            ctx.fillRect(-3, height * 0.15, 4, height * 0.2);
            ctx.fillRect(width - 1, height * 0.15, 4, height * 0.2);
            ctx.fillRect(-3, height * 0.65, 4, height * 0.2);
            ctx.fillRect(width - 1, height * 0.65, 4, height * 0.2);

            // Draw shield aura if active on player
            if (isPlayer && hasShield) {
                const time = Date.now() / 200;
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.ellipse(width / 2, height / 2, width * 0.75 + Math.sin(time) * 3, height * 0.65 + Math.cos(time) * 3, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function drawPowerUp(powerUp) {
            ctx.save();
            ctx.translate(powerUp.x + powerUp.width / 2, powerUp.y + powerUp.height / 2);
            ctx.rotate(powerUp.rotation);

            const radius = powerUp.width / 2;

            if (powerUp.type === 'shield') {
                ctx.fillStyle = '#00e5ff';
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (powerUp.type === 'slowmo') {
                ctx.fillStyle = '#9b59b6';
                ctx.shadowColor = '#9b59b6';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                // Hourglass / Clock symbol
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-radius * 0.3, -radius * 0.4);
                ctx.lineTo(radius * 0.3, -radius * 0.4);
                ctx.lineTo(-radius * 0.3, radius * 0.4);
                ctx.lineTo(radius * 0.3, radius * 0.4);
                ctx.closePath();
                ctx.stroke();
            }

            ctx.restore();
        }

        // --- MAIN GAME LOOP ---
        function update(currentTime) {
            if (!isRunning) return;

            if (!lastTime) {
                lastTime = currentTime;
            }

            let deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Cap maximum deltaTime to prevent tunneling/jumping when switching tabs
            if (deltaTime > 0.1) {
                deltaTime = 0.1;
            }

            // Handle Slow-motion Timer
            if (slowMotionTimer > 0) {
                slowMotionTimer -= deltaTime;
                if (slowMotionTimer < 0) slowMotionTimer = 0;
            }

            // Calculate Effective Speed
            const effectiveSpeed = slowMotionTimer > 0 ? currentSpeed * SLOW_MOTION_FACTOR : currentSpeed;

            if (currentSpeed < MAX_SPEED) {
                currentSpeed += SPEED_INCREMENT * deltaTime;
            }

            distance += (effectiveSpeed * deltaTime) / 10;
            const currentScoreFloor = Math.floor(distance);
            scoreElement.textContent = currentScoreFloor;
            speedElement.textContent = (effectiveSpeed / INITIAL_SPEED).toFixed(1);

            if (currentScoreFloor > 0 && currentScoreFloor - lastScoreSoundDistance >= 50) {
                playScoreSound();
                lastScoreSoundDistance = currentScoreFloor;
            }

            roadLineOffset += effectiveSpeed * deltaTime;
            if (roadLineOffset > 70) {
                roadLineOffset %= 70;
            }

            const lerpSpeed = 15;
            player.x += (player.targetX - player.x) * lerpSpeed * deltaTime;

            nextSpawnY += effectiveSpeed * deltaTime;
            if (nextSpawnY >= ROW_GAP) {
                spawnObstacleRow();
                nextSpawnY = 0;
            }

            // Update & Render Power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += effectiveSpeed * deltaTime;
                p.rotation += 2 * deltaTime;

                if (checkCollision(player, p)) {
                    playPowerUpSound();
                    if (p.type === 'shield') {
                        hasShield = true;
                    } else if (p.type === 'slowmo') {
                        slowMotionTimer = SLOW_MOTION_DURATION;
                    }
                    powerUps.splice(i, 1);
                    continue;
                }

                if (p.y > canvas.height + 100) {
                    powerUps.splice(i, 1);
                }
            }

            // Update & Render Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += effectiveSpeed * deltaTime;

                if (checkCollision(player, obs)) {
                    if (hasShield) {
                        hasShield = false;
                        playShieldAbsorbSound();
                        obstacles.splice(i, 1);
                    } else {
                        endGame();
                        return;
                    }
                    continue;
                }

                if (obs.y > canvas.height + 100) {
                    obstacles.splice(i, 1);
                }
            }

            // Render loop
            drawRoad();

            for (let p of powerUps) {
                drawPowerUp(p);
            }
            
            for (let obs of obstacles) {
                drawCar(obs.x, obs.y, obs.width, obs.height, obs.color, false);
            }

            drawCar(player.x, player.y, player.width, player.height, player.color, true);

            animationFrameId = requestAnimationFrame(update);
        }

        // --- START / STOP CONTROLS ---
        function startGame() {
            initAudio();

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            if (gameMode === 'versus' && currentTurn === 1 && !isRunning) {
                player1Score = 0;
                player2Score = 0;
            }

            resetGame();
            isRunning = true;
            overlay.classList.add('hidden');
            lastTime = 0;
            animationFrameId = requestAnimationFrame(update);
        }

        function endGame() {
            isRunning = false;

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            playCollisionSound();
            setTimeout(() => {
                playGameOverSound();
            }, 300);

            const currentScore = Math.floor(distance);

            if (gameMode === 'single') {
                const playerName = playerNameInput.value;
                addScoreToLeaderboard(playerName, currentScore);

                overlayTitle.textContent = 'انتهت اللعبة!';
                overlayDesc.textContent = `المسافة المقطوعة: ${currentScore} متر`;
                startBtn.textContent = 'إعادة اللعب';
                modeSelectionContainer.classList.remove('hidden');
            } else {
                // Versus Mode Logic
                if (currentTurn === 1) {
                    player1Score = currentScore;
                    currentTurn = 2;
                    overlayTitle.textContent = 'انتهت جولة اللاعب الأول!';
                    overlayDesc.textContent = `قطع اللاعب 1 مسافة: ${player1Score} متر. حان دور اللاعب الثاني!`;
                    startBtn.textContent = 'بدء جولة اللاعب 2';
                    modeSelectionContainer.classList.add('hidden');
                } else {
                    player2Score = currentScore;
                    currentTurn = 1; // Reset turn for next match
                    
                    let winnerMessage = '';
                    if (player1Score > player2Score) {
                        winnerMessage = `فاز اللاعب الأول! (P1: ${player1Score}م vs P2: ${player2Score}م)`;
                    } else if (player2Score > player1Score) {
                        winnerMessage = `فاز اللاعب الثاني! (P2: ${player2Score}م vs P1: ${player1Score}م)`;
                    } else {
                        winnerMessage = `تعادل! (كلاهما قطع ${player1Score} متر)`;
                    }

                    overlayTitle.textContent = 'النتيجة النهائية!';
                    overlayDesc.textContent = winnerMessage;
                    startBtn.textContent = 'لعب مباراة جديدة';
                    modeSelectionContainer.classList.remove('hidden');
                }
            }

            overlay.classList.remove('hidden');
        }

        // --- INITIALIZATION ---
        startBtn.addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            resizeCanvas();
            if (!isRunning) {
                drawRoad();
                drawCar(player.x, player.y, player.width, player.height, player.color, true);
            }
        });

        // Initial setup
        loadLeaderboard();
        resizeCanvas();
        drawRoad();
        drawCar(player.x, player.y, player.width, player.height, player.color, true);
    </script>
